<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e3444" />
      <stop offset="70%" stop-color="#0a1219" />
      <stop offset="100%" stop-color="#05090d" />
    </radialGradient>

    <!-- Enso Ring Gradient -->
    <linearGradient id="enso-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Polished Black River Stone Gradient -->
    <radialGradient id="stone-grad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#334b5c" />
      <stop offset="35%" stop-color="#14212b" />
      <stop offset="80%" stop-color="#060c10" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>

    <!-- Stone Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.25" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Subtle Hitori 3x3 Grid Matrix in Background -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="2">
    <line x1="120" y1="96" x2="120" y2="416" />
    <line x1="210" y1="96" x2="210" y2="416" />
    <line x1="302" y1="96" x2="302" y2="416" />
    <line x1="392" y1="96" x2="392" y2="416" />
    <line x1="96" y1="120" x2="416" y2="120" />
    <line x1="96" y1="210" x2="416" y2="210" />
    <line x1="96" y1="302" x2="416" y2="302" />
    <line x1="96" y1="392" x2="416" y2="392" />
  </g>

  <!-- Glowing Enso / Circle Mark (Safe Cell motif) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#enso-grad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="780 120" filter="url(#glow)" opacity="0.9" />

  <!-- Polished Zen River Stone (Shaded Cell motif) -->
  <ellipse cx="256" cy="256" rx="110" ry="94" fill="url(#stone-grad)" filter="url(#shadow)" transform="rotate(-12 256 256)" />

  <!-- Stone Rim Specular Highlight -->
  <path d="M 180 200 C 210 175, 270 170, 310 185" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="5" stroke-linecap="round" />

  <!-- Stylized Kanji '禅' (Zen) on the stone in warm bamboo gold -->
  <text x="256" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="76" font-weight="900" fill="#fbbf24" text-anchor="middle" opacity="0.92" letter-spacing="2">禅</text>
</svg>
